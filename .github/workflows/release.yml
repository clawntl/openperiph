name: Release

# Push a tag like v0.1.0 to build the app for Windows and Linux and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "openperiph-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/openperiph.exe, README.md, MECHANICS.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            openperiph-*-windows-x64.zip
            target/release/openperiph.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="openperiph-${GITHUB_REF_NAME}-linux-x64"
          mkdir "$name"
          cp target/release/openperiph README.md MECHANICS.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: openperiph-*-linux-x64.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/openperiph-*-windows-x64.zip \
            artifacts/target/release/openperiph.exe \
            artifacts/openperiph-*-linux-x64.tar.gz \
            --title "OpenPeriph ${GITHUB_REF_NAME}" \
            --generate-notes
