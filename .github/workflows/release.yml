name: Release

# Actions tab -> Release -> Run workflow. Raises the version in Cargo.toml (patch, minor or
# major), commits it to main, builds everything and publishes the release.
# Write what changed under "## Unreleased" in CHANGELOG.md beforehand; it becomes the notes.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major, "none (release the version as it is)"]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Raise the version
        id: commit
        run: |
          python3 tools/bump_version.py "${{ inputs.bump }}"
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-and-release:
    needs: bump
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
