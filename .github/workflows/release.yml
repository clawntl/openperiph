name: Release

# Push a tag like v0.2.0, or run this workflow by hand from the Actions tab (it then uses the
# version in Cargo.toml), to build for Windows and Linux and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $name = "openperiph-v$version-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/openperiph.exe, README.md, MECHANICS.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            openperiph-*-windows-x64.zip
            target/release/openperiph.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="openperiph-v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-linux-x64"
          mkdir "$name"
          cp target/release/openperiph README.md MECHANICS.md "$name/"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: openperiph-*-linux-x64.tar.gz

  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust
      - uses: actions/checkout@v7
      - name: makepkg
        run: |
          useradd -m builder
          chown -R builder: .
          su builder -c "cd packaging/arch && makepkg --noconfirm --nodeps --nocheck"
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: packaging/arch/openperiph-*.pkg.tar.zst

  publish:
    needs: [windows, linux, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          gh release create "$tag" \
            artifacts/openperiph-*-windows-x64.zip \
            artifacts/target/release/openperiph.exe \
            artifacts/openperiph-*-linux-x64.tar.gz \
            artifacts/openperiph-*.pkg.tar.zst \
            --target "$GITHUB_SHA" \
            --title "OpenPeriph $tag" \
            --generate-notes
