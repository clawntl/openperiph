[package]
name = "openperiph"
version = "0.6.5"
edition = "2021"
description = "Open settings app for PC peripherals (QMK/VIA keyboards, CIY X78 keyboard, Attack Shark R5 ULTRA mouse) without the vendor software, for Windows and Linux"
# Only these affect the build (keeps cargo from looking into makepkg's folders in packaging/).
include = ["/src", "/assets", "/definitions", "/build.rs", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
md5 = { package = "md-5", version = "0.10" }
rfd = "0.15"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json", "native-certs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1"
